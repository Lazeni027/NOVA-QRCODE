<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code · Assistant pas à pas</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-wrapper {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- CARTE PRINCIPALE --- */
        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem 2.2rem 2.5rem;
            box-shadow: 0 24px 48px -12px rgba(0, 20, 40, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #f0f4fe;
        }

        .card-header i {
            font-size: 1.6rem;
            color: #1d3a5c;
        }

        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1e33;
        }

        .step-badge {
            margin-left: auto;
            background: #eef3fa;
            color: #1d3a5c;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid #d9e2ef;
        }

        /* --- ÉTAPES (stepper) --- */
        .stepper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.2rem;
            position: relative;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            background: #e2eaf5;
            transform: translateY(-50%);
            z-index: 0;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            z-index: 1;
            background: #f4f7fc;
            padding: 0 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: transparent;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            background: #e2eaf5;
            color: #4a6f9e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 3px solid transparent;
        }

        .step-item.active .step-circle {
            background: #1d3a5c;
            color: white;
            border-color: #b6d0e8;
            box-shadow: 0 4px 12px rgba(29, 58, 92, 0.25);
        }

        .step-item.done .step-circle {
            background: #2b7a4b;
            color: white;
        }

        .step-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #6f8fb0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .step-item.active .step-label {
            color: #1d3a5c;
        }

        .step-item.done .step-label {
            color: #2b7a4b;
        }

        /* --- ÉTAPES CONTENU --- */
        .step-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }

        .step-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .step-title i {
            color: #1d3a5c;
            font-size: 1.2rem;
        }

        /* --- FORMULAIRES --- */
        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3a5f;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            width: 1.4rem;
            color: #4a6f9e;
        }

        textarea,
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2eaf5;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.15s;
            font-family: inherit;
            color: #0b1e33;
        }

        textarea:focus,
        input:focus,
        select:focus {
            border-color: #3f6b9e;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(63, 107, 158, 0.08);
            outline: none;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .color-picker-group input[type="color"] {
            width: 42px;
            height: 42px;
            padding: 3px;
            border: 1.5px solid #d9e2ef;
            border-radius: 14px;
            cursor: pointer;
            background: white;
        }

        .color-label {
            font-size: 0.8rem;
            color: #2b4a6e;
        }

        /* --- UPLOAD LOGO --- */
        .file-upload-area {
            border: 1.5px dashed #cbd8ea;
            border-radius: 16px;
            padding: 0.9rem 1.2rem;
            background: #f8faff;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .file-upload-area:hover {
            border-color: #3f6b9e;
            background: #f2f8ff;
        }

        .file-upload-area i {
            font-size: 1.3rem;
            color: #3f6b9e;
        }

        .file-upload-area input[type="file"] {
            display: none;
        }

        #logoPreview {
            display: none;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.7rem;
            flex-wrap: wrap;
        }

        #logoPreview img {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #d9e2ef;
        }

        .remove-logo-btn {
            background: #f1f5fa;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 30px;
            font-size: 1rem;
            color: #7b5a5a;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-logo-btn:hover {
            background: #fee8e8;
            color: #b91c1c;
        }

        .char-counter {
            text-align: right;
            font-size: 0.7rem;
            color: #8aa0bc;
            margin-top: 0.2rem;
        }

        .char-counter.warning { color: #b68b2c; }
        .char-counter.danger { color: #b13e3e; }

        /* --- BOUTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #1d3a5c;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px -4px rgba(29, 58, 92, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn i { font-size: 1rem; }
        .btn:hover {
            background: #264b73;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(29, 58, 92, 0.3);
        }
        .btn:active { transform: translateY(0); }

        .btn-secondary {
            background: #eef3fa;
            color: #1d3a5c;
            box-shadow: none;
            border: 1px solid #d9e2ef;
        }
        .btn-secondary:hover {
            background: #e2eaf5;
            box-shadow: 0 4px 8px -4px rgba(0,0,0,0.04);
        }

        .btn-success {
            background: #1f6d4a;
        }
        .btn-success:hover {
            background: #2a825a;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .btn-group .btn { flex: 1; min-width: 100px; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.8rem;
            gap: 1rem;
            flex-wrap: wrap;
            border-top: 1px solid #eef3fa;
            padding-top: 1.5rem;
        }

        /* --- APERÇU QR --- */
        .qr-preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: #fafcff;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid #e8eff8;
            margin-top: 0.5rem;
        }

        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.04);
            max-width: 280px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #qrImage {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
        }
        .loader.show { display: block; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e2eaf5;
            border-top: 4px solid #1d3a5c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .preview-info {
            background: white;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            width: 100%;
            border: 1px solid #e8eff8;
            font-size: 0.8rem;
            line-height: 1.6;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.2rem 1rem;
        }
        .preview-info .label { font-weight: 600; color: #1d3a5c; }
        .preview-info span:last-child { color: #0b1e33; text-align: right; }

        /* --- TOAST / ALERT --- */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #0b1e33;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { background: #1a4b3c; }
        .toast-error { background: #8b2c2c; }

        .alert {
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .alert-success { background: #e3f3ed; color: #11543c; border: 1px solid #b4d9cc; display: block; }
        .alert-error { background: #fce8e8; color: #8b2c2c; border: 1px solid #f3cfcf; display: block; }

        /* --- RESPONSIVE --- */
        @media (max-width: 720px) {
            .card { padding: 1.5rem; }
            .form-row { grid-template-columns: 1fr; }
            .step-label { font-size: 0.6rem; }
            .step-circle { width: 34px; height: 34px; font-size: 0.8rem; }
            .stepper { gap: 0.2rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .preview-info { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .card-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="card">
        <!-- En-tête -->
        <div class="card-header">
            <i class="fas fa-qrcode"></i>
            <h1>Assistant QR Code</h1>
            <span class="step-badge" id="stepBadge">Étape 1 / 3</span>
        </div>

        <!-- Stepper -->
        <div class="stepper" id="stepper">
            <button class="step-item active" data-step="1" type="button">
                <span class="step-circle">1</span>
                <span class="step-label">Contenu</span>
            </button>
            <button class="step-item" data-step="2" type="button">
                <span class="step-circle">2</span>
                <span class="step-label">Style</span>
            </button>
            <button class="step-item" data-step="3" type="button">
                <span class="step-circle">3</span>
                <span class="step-label">Télécharger</span>
            </button>
        </div>

        <!-- Alertes -->
        <div id="alert" class="alert"></div>

        <!-- ===== ÉTAPE 1 : CONTENU ===== -->
        <div class="step-panel active" id="step1">
            <div class="step-title"><i class="fas fa-pen-fancy"></i> Que voulez-vous encoder ?</div>
            <div class="form-group">
                <label for="qrData"><i class="fas fa-database"></i> Données (texte, URL, email, etc.)</label>
                <textarea id="qrData" placeholder="Ex: https://mon-site.com, texte libre, numéro..." required>https://exemple.com</textarea>
                <div class="char-counter" id="charCounter">0 caractères</div>
            </div>

            <div class="form-group">
                <label for="dataType"><i class="fas fa-tag"></i> Type (indice)</label>
                <select id="dataType">
                    <option value="text">📄 Texte libre</option>
                    <option value="url" selected>🔗 Lien / URL</option>
                    <option value="email">✉️ Email</option>
                    <option value="phone">📞 Téléphone</option>
                    <option value="sms">💬 SMS</option>
                    <option value="wifi">📶 WiFi</option>
                </select>
            </div>

            <div class="action-bar">
                <span></span>
                <button class="btn" id="toStep2"><i class="fas fa-arrow-right"></i> Configurer le style</button>
            </div>
        </div>

        <!-- ===== ÉTAPE 2 : STYLE ===== -->
        <div class="step-panel" id="step2">
            <div class="step-title"><i class="fas fa-sliders-h"></i> Personnalisation</div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> Fond</label>
                    <div class="color-picker-group">
                        <input type="color" id="bgColor" value="#ffffff">
                        <span class="color-label">Blanc</span>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> QR</label>
                    <div class="color-picker-group">
                        <input type="color" id="fillColor" value="#1d3a5c">
                        <span class="color-label">Bleu foncé</span>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="boxSize"><i class="fas fa-vector-square"></i> Taille module</label>
                    <input type="number" id="boxSize" value="10" min="2" max="18">
                </div>
                <div class="form-group">
                    <label for="borderSize"><i class="fas fa-border-all"></i> Bordure</label>
                    <input type="number" id="borderSize" value="4" min="0" max="10">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="errorCorrection"><i class="fas fa-shield-alt"></i> Correction</label>
                    <select id="errorCorrection">
                        <option value="L">L (7%)</option>
                        <option value="M">M (15%)</option>
                        <option value="Q">Q (25%)</option>
                        <option value="H" selected>H (30%)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="qrVersion"><i class="fas fa-layer-group"></i> Version</label>
                    <select id="qrVersion">
                        <option value="auto">Auto</option>
                        <option value="1">1 (21x21)</option>
                        <option value="2">2 (25x25)</option>
                        <option value="3">3 (29x29)</option>
                        <option value="5">5 (37x37)</option>
                        <option value="10">10 (57x57)</option>
                        <option value="20">20 (101x101)</option>
                        <option value="40">40 (177x177)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="textOverlay"><i class="fas fa-font"></i> Texte additionnel</label>
                <input type="text" id="textOverlay" placeholder="Optionnel">
            </div>

            <div class="form-group">
                <label><i class="fas fa-image"></i> Logo (optionnel)</label>
                <div class="file-upload-area" id="fileDropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span id="fileLabelText">Cliquez ou glissez une image</span>
                    <input type="file" id="logoUpload" accept="image/*">
                </div>
                <div id="logoPreview">
                    <img id="logoPreviewImg" alt="logo">
                    <button type="button" class="remove-logo-btn" id="removeLogoBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label for="styleSelect"><i class="fas fa-magic"></i> Style prédéfini</label>
                <select id="styleSelect">
                    <option value="classic">Classique</option>
                    <option value="minimal">Minimal</option>
                    <option value="rounded">Coins arrondis</option>
                    <option value="gradient">Dégradé</option>
                </select>
            </div>

            <div class="action-bar">
                <button class="btn btn-secondary" id="toStep1"><i class="fas fa-arrow-left"></i> Retour</button>
                <button class="btn" id="generateAndGoStep3"><i class="fas fa-qrcode"></i> Générer &amp; télécharger</button>
            </div>
        </div>

        <!-- ===== ÉTAPE 3 : TÉLÉCHARGER ===== -->
        <div class="step-panel" id="step3">
            <div class="step-title"><i class="fas fa-download"></i> Télécharger votre QR Code</div>

            <!-- Aperçu -->
            <div class="qr-preview-area">
                <div class="qr-container">
                    <img id="qrImage" src="" alt="QR Code">
                </div>
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p style="margin-top: 0.5rem; color: #4a6f9e; font-size: 0.85rem;">Génération…</p>
                </div>

                <div class="preview-info">
                    <span class="label">Données</span> <span id="previewData">—</span>
                    <span class="label">Taille</span> <span id="previewSize">—</span>
                    <span class="label">Version</span> <span id="previewVersion">—</span>
                    <span class="label">Correction</span> <span id="previewCorrection">—</span>
                </div>

                <div class="btn-group" style="width:100%;">
                    <button class="btn btn-success" id="downloadBtn"><i class="fas fa-download"></i> Télécharger PNG</button>
                    <button class="btn btn-secondary" id="copyBtn"><i class="fas fa-copy"></i> Copier base64</button>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-secondary" id="toStep2"><i class="fas fa-arrow-left"></i> Modifier le style</button>
                <button class="btn" id="regenerateBtn"><i class="fas fa-redo"></i> Régénérer</button>
            </div>
        </div>

    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">Succès</span></div>

<script>
    (function() {
        "use strict";

        // --- ÉLÉMENTS ---
        const steps = document.querySelectorAll('.step-item');
        const panels = {
            1: document.getElementById('step1'),
            2: document.getElementById('step2'),
            3: document.getElementById('step3')
        };
        const stepBadge = document.getElementById('stepBadge');

        // Boutons navigation
        const toStep1 = document.getElementById('toStep1');
        const toStep2 = document.getElementById('toStep2');
        const toStep2From1 = document.getElementById('toStep2');
        const generateAndGoStep3 = document.getElementById('generateAndGoStep3');
        const toStep2Back = document.getElementById('toStep2'); // déjà
        const regenerateBtn = document.getElementById('regenerateBtn');

        // Champs
        const qrData = document.getElementById('qrData');
        const dataType = document.getElementById('dataType');
        const bgColor = document.getElementById('bgColor');
        const fillColor = document.getElementById('fillColor');
        const boxSize = document.getElementById('boxSize');
        const borderSize = document.getElementById('borderSize');
        const errorCorrection = document.getElementById('errorCorrection');
        const qrVersion = document.getElementById('qrVersion');
        const textOverlay = document.getElementById('textOverlay');
        const styleSelect = document.getElementById('styleSelect');
        const logoUpload = document.getElementById('logoUpload');
        const fileDropArea = document.getElementById('fileDropArea');
        const fileLabelText = document.getElementById('fileLabelText');
        const logoPreview = document.getElementById('logoPreview');
        const logoPreviewImg = document.getElementById('logoPreviewImg');
        const removeLogoBtn = document.getElementById('removeLogoBtn');
        const charCounter = document.getElementById('charCounter');

        const qrImage = document.getElementById('qrImage');
        const loader = document.getElementById('loader');
        const previewData = document.getElementById('previewData');
        const previewSize = document.getElementById('previewSize');
        const previewVersion = document.getElementById('previewVersion');
        const previewCorrection = document.getElementById('previewCorrection');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');

        const alertBox = document.getElementById('alert');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');

        // --- ÉTAT ---
        let currentStep = 1;
        let currentQRUrl = null;
        let logoFile = null;
        let isGenerating = false;

        // --- FONCTIONS ---
        function showToast(message, type = 'success') {
            toastMsg.textContent = message;
            toast.className = 'toast';
            if (type === 'success') toast.classList.add('toast-success');
            else toast.classList.add('toast-error');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3200);
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = 'alert';
            if (type === 'success') alertBox.classList.add('alert-success');
            else alertBox.classList.add('alert-error');
            clearTimeout(alertBox._timer);
            alertBox._timer = setTimeout(() => { alertBox.className = 'alert'; }, 5000);
        }

        function updateCharCounter(text) {
            const len = text.length;
            charCounter.textContent = `${len} caractères`;
            charCounter.className = 'char-counter';
            if (len > 2000) charCounter.classList.add('danger');
            else if (len > 1200) charCounter.classList.add('warning');
        }

        // --- NAVIGATION ÉTAPES ---
        function goToStep(step) {
            if (step < 1 || step > 3) return;
            currentStep = step;
            // Mettre à jour les boutons du stepper
            steps.forEach((btn, idx) => {
                const num = idx + 1;
                btn.classList.remove('active', 'done');
                if (num === step) btn.classList.add('active');
                else if (num < step) btn.classList.add('done');
            });
            // Panels
            Object.keys(panels).forEach(key => {
                panels[key].classList.toggle('active', parseInt(key) === step);
            });
            stepBadge.textContent = `Étape ${step} / 3`;
            // Si on va à l'étape 3, on génère si besoin
            if (step === 3 && !currentQRUrl) {
                generateQR(true);
            }
        }

        // --- GÉNÉRATION QR ---
        function buildQRUrl(params) {
            const base = 'https://api.qrserver.com/v1/create-qr-code/';
            const q = new URLSearchParams();
            q.set('data', params.data);
            q.set('size', `${params.boxSize * 20}x${params.boxSize * 20}`);
            q.set('format', 'png');
            q.set('bgcolor', params.bgColor.replace('#', ''));
            q.set('color', params.fillColor.replace('#', ''));
            q.set('margin', params.border);
            q.set('qzone', '2');
            q.set('ecc', params.errorCorrection);
            if (params.version !== 'auto') q.set('version', params.version);
            return base + '?' + q.toString();
        }

        function generateQR(silent = false) {
            const data = qrData.value.trim();
            if (!data) {
                if (!silent) showAlert('Veuillez entrer des données.', 'error');
                return;
            }

            isGenerating = true;
            loader.classList.add('show');
            qrImage.style.display = 'none';

            const params = {
                data: data,
                bgColor: bgColor.value,
                fillColor: fillColor.value,
                boxSize: parseInt(boxSize.value) || 10,
                border: parseInt(borderSize.value) || 4,
                errorCorrection: errorCorrection.value,
                version: qrVersion.value,
                text: textOverlay.value,
                style: styleSelect.value,
            };

            setTimeout(() => {
                try {
                    const url = buildQRUrl(params);
                    qrImage.src = url;
                    qrImage.alt = 'QR Code';
                    currentQRUrl = url;

                    previewData.textContent = data.length > 40 ? data.slice(0, 38) + '…' : data;
                    previewSize.textContent = `${params.boxSize * 20}×${params.boxSize * 20} px`;
                    previewVersion.textContent = params.version === 'auto' ? 'Auto' : `v${params.version}`;
                    previewCorrection.textContent = params.errorCorrection;

                    if (!silent) showToast('QR Code généré', 'success');
                } catch (e) {
                    if (!silent) showAlert('Erreur : ' + e.message, 'error');
                } finally {
                    loader.classList.remove('show');
                    qrImage.style.display = 'block';
                    isGenerating = false;
                }
            }, 500);
        }

        // --- TÉLÉCHARGER ---
        function downloadQR() {
            if (!currentQRUrl) {
                showAlert('Générez d\'abord un QR code.', 'error');
                return;
            }
            const link = document.createElement('a');
            link.href = currentQRUrl;
            link.download = `qrcode_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Téléchargement démarré', 'success');
        }

        // --- COPIER BASE64 ---
        async function copyQR() {
            if (!currentQRUrl) {
                showAlert('Générez d\'abord un QR code.', 'error');
                return;
            }
            try {
                const resp = await fetch(currentQRUrl);
                const blob = await resp.blob();
                const reader = new FileReader();
                reader.onloadend = function() {
                    const b64 = reader.result;
                    navigator.clipboard.writeText(b64).then(() => {
                        showToast('Copié en base64 !', 'success');
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = b64;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        showToast('Copié !', 'success');
                    });
                };
                reader.readAsDataURL(blob);
            } catch (e) {
                showAlert('Erreur copie : ' + e.message, 'error');
            }
        }

        // --- LOGO ---
        function handleLogoFile(file) {
            if (!file) return;
            logoFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                logoPreviewImg.src = e.target.result;
                logoPreview.style.display = 'flex';
                fileLabelText.textContent = file.name;
                showToast('Logo chargé', 'success');
            };
            reader.readAsDataURL(file);
        }

        function removeLogo() {
            logoFile = null;
            logoUpload.value = '';
            logoPreview.style.display = 'none';
            fileLabelText.textContent = 'Cliquez ou glissez une image';
            showToast('Logo retiré', 'success');
        }

        // --- ÉVÉNEMENTS ---
        // Stepper
        steps.forEach((btn) => {
            btn.addEventListener('click', function() {
                const step = parseInt(this.dataset.step);
                if (step === 3 && !currentQRUrl) {
                    generateQR(true);
                }
                goToStep(step);
            });
        });

        // Navigation
        toStep1.addEventListener('click', () => goToStep(1));
        toStep2.addEventListener('click', () => goToStep(2));
        toStep2From1.addEventListener('click', () => goToStep(2));

        generateAndGoStep3.addEventListener('click', function() {
            const data = qrData.value.trim();
            if (!data) {
                showAlert('Veuillez entrer des données.', 'error');
                return;
            }
            generateQR(false);
            goToStep(3);
        });

        regenerateBtn.addEventListener('click', function() {
            generateQR(false);
        });

        // Télécharger / Copier
        downloadBtn.addEventListener('click', downloadQR);
        copyBtn.addEventListener('click', copyQR);

        // Compteur
        qrData.addEventListener('input', function() {
            updateCharCounter(this.value);
        });

        // Logo
        logoUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) handleLogoFile(this.files[0]);
        });

        fileDropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#1d3a5c';
            this.style.background = '#e7f0fe';
        });
        fileDropArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#cbd8ea';
            this.style.background = '#f8faff';
        });
        fileDropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#cbd8ea';
            this.style.background = '#f8faff';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                logoUpload.files = files;
                handleLogoFile(files[0]);
            }
        });
        removeLogoBtn.addEventListener('click', removeLogo);

        // Raccourci Ctrl+Enter depuis étape 1 ou 2
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                if (currentStep === 1 || currentStep === 2) {
                    const data = qrData.value.trim();
                    if (!data) { showAlert('Entrez des données.', 'error'); return; }
                    generateQR(false);
                    goToStep(3);
                }
            }
        });

        // --- INIT ---
        updateCharCounter(qrData.value);
        // Génération auto à l'étape 1 (pour préremplir)
        setTimeout(() => {
            generateQR(true);
        }, 300);
        goToStep(1);

    })();
</script>
</body>
</html>
