<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code · Assistant malin</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f2f6fe;
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-wrapper {
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- CARTE PRINCIPALE --- */
        .card {
            background: #ffffff;
            border-radius: 40px;
            padding: 2rem 2.2rem 2.5rem;
            box-shadow: 0 20px 48px -12px rgba(0, 20, 40, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 28px 56px -16px rgba(0, 20, 40, 0.18);
        }

        /* --- EN-TÊTE --- */
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .card-header .icon-robot {
            background: linear-gradient(135deg, #1d3a5c, #2a5a7a);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(29, 58, 92, 0.2);
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0b1e33;
            letter-spacing: -0.02em;
        }

        .card-header .ia-badge {
            margin-left: auto;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid #bfdbfe;
        }

        /* --- BULLE DE L'ASSISTANT (communication améliorée) --- */
        .assistant-bubble {
            background: #f0f7ff;
            border-radius: 20px 20px 20px 6px;
            padding: 0.9rem 1.5rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            border: 1px solid #e2edfc;
            transition: all 0.3s ease;
            min-height: 60px;
        }

        .assistant-bubble .avatar {
            font-size: 1.6rem;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .assistant-bubble .message-content {
            font-size: 0.95rem;
            color: #1f3a5f;
            line-height: 1.5;
            flex: 1;
        }

        .assistant-bubble .message-content strong {
            color: #0b1e33;
        }

        .assistant-bubble .message-content .highlight {
            background: #dbeafe;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1d4ed8;
        }

        /* --- STEPPER --- */
        .stepper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            position: relative;
            padding: 0 0.5rem;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 2rem;
            right: 2rem;
            height: 3px;
            background: #e2eaf5;
            transform: translateY(-50%);
            z-index: 0;
            border-radius: 4px;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            z-index: 1;
            background: transparent;
            padding: 0 0.5rem;
            cursor: pointer;
            border: none;
            transition: 0.25s ease;
            flex: 1;
        }

        .step-circle {
            width: 44px;
            height: 44px;
            border-radius: 44px;
            background: #e2eaf5;
            color: #8aa0bc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .step-item.active .step-circle {
            background: #1d3a5c;
            color: white;
            border-color: #b6d0e8;
            box-shadow: 0 4px 16px rgba(29, 58, 92, 0.25);
            transform: scale(1.05);
        }

        .step-item.done .step-circle {
            background: #1f6d4a;
            color: white;
            border-color: #b8d9c9;
        }

        .step-item.done .step-circle i {
            font-size: 1.1rem;
        }

        .step-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #8aa0bc;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            transition: color 0.3s;
        }

        .step-item.active .step-label {
            color: #1d3a5c;
        }

        .step-item.done .step-label {
            color: #1f6d4a;
        }

        /* --- PANNEAUX --- */
        .step-panel {
            display: none;
            animation: slideFade 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .step-panel.active {
            display: block;
        }

        @keyframes slideFade {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .step-title i {
            color: #1d3a5c;
            font-size: 1.2rem;
            background: #eef3fa;
            padding: 0.4rem;
            border-radius: 12px;
        }

        /* --- FORMULAIRES --- */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3a5f;
            margin-bottom: 0.3rem;
        }

        textarea,
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2eaf5;
            border-radius: 16px;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.2s ease;
            font-family: inherit;
            color: #0b1e33;
        }

        textarea:focus,
        input:focus,
        select:focus {
            border-color: #3f6b9e;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(63, 107, 158, 0.08);
            outline: none;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .color-picker-group input[type="color"] {
            width: 44px;
            height: 44px;
            padding: 3px;
            border: 1.5px solid #d9e2ef;
            border-radius: 16px;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }

        .color-picker-group input[type="color"]:hover {
            border-color: #3f6b9e;
        }

        .color-label {
            font-size: 0.8rem;
            color: #2b4a6e;
        }

        /* --- UPLOAD LOGO --- */
        .file-upload-area {
            border: 1.5px dashed #cbd8ea;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            background: #f8faff;
            transition: 0.25s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .file-upload-area:hover {
            border-color: #3f6b9e;
            background: #f2f8ff;
            transform: translateY(-1px);
        }

        .file-upload-area i {
            font-size: 1.2rem;
            color: #3f6b9e;
        }

        .file-upload-area input[type="file"] {
            display: none;
        }

        #logoPreview {
            display: none;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
            animation: slideFade 0.3s ease;
        }

        #logoPreview img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #d9e2ef;
        }

        .remove-logo-btn {
            background: #f1f5fa;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 28px;
            font-size: 0.9rem;
            color: #7b5a5a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-logo-btn:hover {
            background: #fee8e8;
            color: #b91c1c;
            transform: scale(1.1);
        }

        .char-counter {
            text-align: right;
            font-size: 0.7rem;
            color: #8aa0bc;
            margin-top: 0.2rem;
        }

        /* --- BOUTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #1d3a5c;
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 12px -4px rgba(29, 58, 92, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 130px;
        }

        .btn i { font-size: 1.1rem; }
        .btn:hover {
            background: #264b73;
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 24px -8px rgba(29, 58, 92, 0.3);
        }
        .btn:active { transform: translateY(0) scale(0.98); }

        .btn-secondary {
            background: #eef3fa;
            color: #1d3a5c;
            box-shadow: none;
            border: 1px solid #d9e2ef;
        }
        .btn-secondary:hover {
            background: #e2eaf5;
            box-shadow: 0 4px 12px -4px rgba(0,0,0,0.06);
        }

        .btn-success {
            background: #1f6d4a;
            box-shadow: 0 4px 12px -4px rgba(31, 109, 74, 0.3);
        }
        .btn-success:hover {
            background: #2a825a;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .btn-group .btn { flex: 1; min-width: 110px; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.8rem;
            gap: 1rem;
            flex-wrap: wrap;
            border-top: 1px solid #eef3fa;
            padding-top: 1.5rem;
        }

        .action-bar .btn {
            min-width: 110px;
        }

        /* --- APERÇU QR --- */
        .qr-preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: #fafcff;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid #e8eff8;
            transition: border-color 0.3s;
        }

        .qr-preview-area:hover {
            border-color: #d0dcee;
        }

        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.04);
            max-width: 260px;
            width: 100%;
            display: flex;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .qr-container:hover {
            transform: scale(1.02);
        }

        #qrImage {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            transition: opacity 0.3s;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
        }
        .loader.show { display: block; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e2eaf5;
            border-top: 4px solid #1d3a5c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .preview-info {
            background: white;
            border-radius: 16px;
            padding: 0.6rem 1.2rem;
            width: 100%;
            border: 1px solid #e8eff8;
            font-size: 0.8rem;
            line-height: 1.8;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.1rem 1rem;
        }
        .preview-info .label { font-weight: 600; color: #1d3a5c; }
        .preview-info span:last-child { color: #0b1e33; text-align: right; word-break: break-word; }

        /* --- TOAST / ALERT --- */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #0b1e33;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { background: #1a4b3c; }
        .toast-error { background: #8b2c2c; }

        .alert {
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .alert-success { background: #e3f3ed; color: #11543c; border: 1px solid #b4d9cc; display: block; }
        .alert-error { background: #fce8e8; color: #8b2c2c; border: 1px solid #f3cfcf; display: block; }

        /* --- RESPONSIVE --- */
        @media (max-width: 640px) {
            .card { padding: 1.2rem; border-radius: 28px; }
            .form-row { grid-template-columns: 1fr; }
            .stepper { gap: 0; padding: 0; }
            .step-label { font-size: 0.5rem; }
            .step-circle { width: 36px; height: 36px; font-size: 0.8rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .action-bar .btn { width: 100%; }
            .btn-group .btn { min-width: 70px; }
            .preview-info { grid-template-columns: 1fr; }
            .assistant-bubble { font-size: 0.85rem; padding: 0.8rem 1rem; }
            .card-header h1 { font-size: 1.2rem; }
            .card-header .ia-badge { font-size: 0.6rem; padding: 0.2rem 0.8rem; }
            .card-header .icon-robot { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="card">

        <!-- En-tête -->
        <div class="card-header">
            <div class="icon-robot"><i class="fas fa-robot"></i></div>
            <h1>Mon QR Code</h1>
            <span class="ia-badge"><i class="fas fa-sparkles"></i> Assistant</span>
        </div>

        <!-- Bulle de l'assistant -->
        <div class="assistant-bubble" id="assistantBubble">
            <div class="avatar">🤖</div>
            <div class="message-content" id="assistantMessage">
                <strong>Prêt ?</strong> <span id="assistantText">Donnez-moi le texte ou le lien à encoder.</span>
            </div>
        </div>

        <!-- Stepper -->
        <div class="stepper" id="stepper">
            <button class="step-item active" data-step="1" type="button">
                <span class="step-circle">1</span>
                <span class="step-label">Contenu</span>
            </button>
            <button class="step-item" data-step="2" type="button">
                <span class="step-circle">2</span>
                <span class="step-label">Style</span>
            </button>
            <button class="step-item" data-step="3" type="button">
                <span class="step-circle"><i class="fas fa-download"></i></span>
                <span class="step-label">Finaliser</span>
            </button>
        </div>

        <!-- Alertes -->
        <div id="alert" class="alert"></div>

        <!-- ===== ÉTAPE 1 ===== -->
        <div class="step-panel active" id="step1">
            <div class="step-title"><i class="fas fa-pen-fancy"></i> Étape 1 · Contenu</div>

            <div class="form-group">
                <label for="qrData">📝 Que voulez-vous encoder ?</label>
                <textarea id="qrData" placeholder="Ex: https://mon-site.com, un texte, un numéro..." required></textarea>
                <div class="char-counter" id="charCounter">0 caractères</div>
            </div>

            <div class="form-group">
                <label for="dataType">🏷️ Type (pour m'aider)</label>
                <select id="dataType">
                    <option value="text">📄 Texte libre</option>
                    <option value="url" selected>🔗 Lien / URL</option>
                    <option value="email">✉️ Email</option>
                    <option value="phone">📞 Téléphone</option>
                    <option value="sms">💬 SMS</option>
                    <option value="wifi">📶 WiFi</option>
                </select>
            </div>

            <div class="action-bar">
                <span style="font-size: 0.8rem; color: #8aa0bc;"><i class="fas fa-arrow-right"></i> Étape suivante</span>
                <button class="btn" id="toStep2"><i class="fas fa-arrow-right"></i> Personnaliser</button>
            </div>
        </div>

        <!-- ===== ÉTAPE 2 ===== -->
        <div class="step-panel" id="step2">
            <div class="step-title"><i class="fas fa-sliders-h"></i> Étape 2 · Style</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Couleur de fond</label>
                    <div class="color-picker-group">
                        <input type="color" id="bgColor" value="#ffffff">
                        <span class="color-label">Blanc</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Couleur du QR</label>
                    <div class="color-picker-group">
                        <input type="color" id="fillColor" value="#1d3a5c">
                        <span class="color-label">Bleu foncé</span>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="boxSize">📏 Taille des carreaux</label>
                    <input type="number" id="boxSize" value="10" min="2" max="18">
                </div>
                <div class="form-group">
                    <label for="borderSize">🖼️ Bordure (espace blanc)</label>
                    <input type="number" id="borderSize" value="4" min="0" max="10">
                </div>
            </div>

            <div class="form-group">
                <label for="errorCorrection">🛡️ Niveau de correction</label>
                <select id="errorCorrection">
                    <option value="L">L – Faible (7%)</option>
                    <option value="M">M – Moyen (15%)</option>
                    <option value="Q">Q – Élevé (25%)</option>
                    <option value="H" selected>H – Maximum (30%)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="textOverlay">✏️ Texte supplémentaire (optionnel)</label>
                <input type="text" id="textOverlay" placeholder="Ex: « Scannez-moi ! »">
            </div>

            <div class="form-group">
                <label><i class="fas fa-image"></i> Logo (optionnel)</label>
                <div class="file-upload-area" id="fileDropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span id="fileLabelText">Cliquez ou glissez une image</span>
                    <input type="file" id="logoUpload" accept="image/*">
                </div>
                <div id="logoPreview">
                    <img id="logoPreviewImg" alt="logo">
                    <button type="button" class="remove-logo-btn" id="removeLogoBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-secondary" id="toStep1"><i class="fas fa-arrow-left"></i> Retour</button>
                <button class="btn" id="generateAndGoStep3"><i class="fas fa-qrcode"></i> Voir mon QR</button>
            </div>
        </div>

        <!-- ===== ÉTAPE 3 ===== -->
        <div class="step-panel" id="step3">
            <div class="step-title"><i class="fas fa-download"></i> Étape 3 · Télécharger</div>

            <div class="qr-preview-area">
                <div class="qr-container">
                    <img id="qrImage" src="" alt="QR Code">
                </div>
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p style="margin-top: 0.5rem; color: #4a6f9e; font-size: 0.85rem;">Génération en cours…</p>
                </div>

                <div class="preview-info">
                    <span class="label">📦 Données</span> <span id="previewData">—</span>
                    <span class="label">📐 Taille</span> <span id="previewSize">—</span>
                    <span class="label">🛡️ Correction</span> <span id="previewCorrection">—</span>
                </div>

                <div class="btn-group" style="width:100%;">
                    <button class="btn btn-success" id="downloadBtn"><i class="fas fa-download"></i> Télécharger</button>
                    <button class="btn btn-secondary" id="copyBtn"><i class="fas fa-copy"></i> Copier</button>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-secondary" id="toStep2"><i class="fas fa-arrow-left"></i> Modifier</button>
                <button class="btn" id="regenerateBtn"><i class="fas fa-redo"></i> Régénérer</button>
            </div>
        </div>

    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">Succès</span></div>

<script>
    (function() {
        "use strict";

        // --- DOM ---
        const steps = document.querySelectorAll('.step-item');
        const panels = { 1: document.getElementById('step1'), 2: document.getElementById('step2'), 3: document.getElementById('step3') };
        const assistantText = document.getElementById('assistantText');

        const toStep1 = document.getElementById('toStep1');
        const toStep2 = document.getElementById('toStep2');
        const generateAndGoStep3 = document.getElementById('generateAndGoStep3');
        const regenerateBtn = document.getElementById('regenerateBtn');

        const qrData = document.getElementById('qrData');
        const bgColor = document.getElementById('bgColor');
        const fillColor = document.getElementById('fillColor');
        const boxSize = document.getElementById('boxSize');
        const borderSize = document.getElementById('borderSize');
        const errorCorrection = document.getElementById('errorCorrection');
        const textOverlay = document.getElementById('textOverlay');
        const logoUpload = document.getElementById('logoUpload');
        const fileDropArea = document.getElementById('fileDropArea');
        const fileLabelText = document.getElementById('fileLabelText');
        const logoPreview = document.getElementById('logoPreview');
        const logoPreviewImg = document.getElementById('logoPreviewImg');
        const removeLogoBtn = document.getElementById('removeLogoBtn');
        const charCounter = document.getElementById('charCounter');

        const qrImage = document.getElementById('qrImage');
        const loader = document.getElementById('loader');
        const previewData = document.getElementById('previewData');
        const previewSize = document.getElementById('previewSize');
        const previewCorrection = document.getElementById('previewCorrection');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');

        const alertBox = document.getElementById('alert');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');

        // --- ÉTAT ---
        let currentStep = 1;
        let currentQRUrl = null;
        let logoFile = null;

        // --- MESSAGES ASSISTANT (communication améliorée) ---
        const messages = {
            1: "Donnez-moi le texte ou le lien à encoder.",
            2: "Personnalisez les couleurs et la taille. Ajoutez un logo si vous voulez.",
            3: "Votre QR est prêt ! Téléchargez-le ou copiez-le en un clic."
        };

        function updateAssistant(step) {
            assistantText.textContent = messages[step] || messages[1];
        }

        // --- UTILITAIRES ---
        function showToast(message, type = 'success') {
            toastMsg.textContent = message;
            toast.className = 'toast';
            toast.classList.add(type === 'success' ? 'toast-success' : 'toast-error');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = 'alert';
            alertBox.classList.add(type === 'success' ? 'alert-success' : 'alert-error');
            clearTimeout(alertBox._timer);
            alertBox._timer = setTimeout(() => { alertBox.className = 'alert'; }, 5000);
        }

        function updateCharCounter(text) {
            const len = text.length;
            charCounter.textContent = `${len} caractères`;
            charCounter.className = 'char-counter';
            if (len > 2000) charCounter.classList.add('danger');
            else if (len > 1200) charCounter.classList.add('warning');
        }

        // --- NAVIGATION ---
        function goToStep(step) {
            if (step < 1 || step > 3) return;
            currentStep = step;
            steps.forEach((btn, idx) => {
                const num = idx + 1;
                btn.classList.remove('active', 'done');
                if (num === step) btn.classList.add('active');
                else if (num < step) btn.classList.add('done');
                if (num < step) {
                    btn.querySelector('.step-circle').innerHTML = '<i class="fas fa-check"></i>';
                } else {
                    btn.querySelector('.step-circle').textContent = num;
                }
                if (num === 3 && num === step) {
                    btn.querySelector('.step-circle').innerHTML = '<i class="fas fa-download"></i>';
                } else if (num === 3 && num < step) {
                    btn.querySelector('.step-circle').innerHTML = '<i class="fas fa-check"></i>';
                } else if (num === 3 && num > step) {
                    btn.querySelector('.step-circle').textContent = '3';
                }
            });
            Object.keys(panels).forEach(key => {
                panels[key].classList.toggle('active', parseInt(key) === step);
            });
            updateAssistant(step);
            if (step === 3 && !currentQRUrl) {
                generateQR(true);
            }
        }

        // --- GÉNÉRATION QR ---
        function buildQRUrl(params) {
            const base = 'https://api.qrserver.com/v1/create-qr-code/';
            const q = new URLSearchParams();
            q.set('data', params.data);
            q.set('size', `${params.boxSize * 20}x${params.boxSize * 20}`);
            q.set('format', 'png');
            q.set('bgcolor', params.bgColor.replace('#', ''));
            q.set('color', params.fillColor.replace('#', ''));
            q.set('margin', params.border);
            q.set('qzone', '2');
            q.set('ecc', params.errorCorrection);
            return base + '?' + q.toString();
        }

        function generateQR(silent = false) {
            const data = qrData.value.trim();
            if (!data) {
                if (!silent) showAlert('Entrez des données d\'abord.', 'error');
                return;
            }

            loader.classList.add('show');
            qrImage.style.display = 'none';

            const params = {
                data: data,
                bgColor: bgColor.value,
                fillColor: fillColor.value,
                boxSize: parseInt(boxSize.value) || 10,
                border: parseInt(borderSize.value) || 4,
                errorCorrection: errorCorrection.value,
            };

            setTimeout(() => {
                try {
                    const url = buildQRUrl(params);
                    qrImage.src = url;
                    qrImage.alt = 'QR Code';
                    currentQRUrl = url;

                    previewData.textContent = data.length > 38 ? data.slice(0, 35) + '…' : data;
                    previewSize.textContent = `${params.boxSize * 20}×${params.boxSize * 20} px`;
                    previewCorrection.textContent = params.errorCorrection;

                    if (!silent) showToast('QR prêt !', 'success');
                } catch (e) {
                    if (!silent) showAlert('Erreur : ' + e.message, 'error');
                } finally {
                    loader.classList.remove('show');
                    qrImage.style.display = 'block';
                }
            }, 500);
        }

        // --- TÉLÉCHARGER ---
        function downloadQR() {
            if (!currentQRUrl) {
                showAlert('Générez d\'abord un QR.', 'error');
                return;
            }
            const link = document.createElement('a');
            link.href = currentQRUrl;
            link.download = `qrcode_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Téléchargé ✅', 'success');
        }

        // --- COPIER ---
        async function copyQR() {
            if (!currentQRUrl) {
                showAlert('Générez d\'abord un QR.', 'error');
                return;
            }
            try {
                const resp = await fetch(currentQRUrl);
                const blob = await resp.blob();
                const reader = new FileReader();
                reader.onloadend = function() {
                    const b64 = reader.result;
                    navigator.clipboard.writeText(b64).then(() => {
                        showToast('Copié en base64 !', 'success');
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = b64;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        showToast('Copié !', 'success');
                    });
                };
                reader.readAsDataURL(blob);
            } catch (e) {
                showAlert('Erreur copie : ' + e.message, 'error');
            }
        }

        // --- LOGO ---
        function handleLogoFile(file) {
            if (!file) return;
            logoFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                logoPreviewImg.src = e.target.result;
                logoPreview.style.display = 'flex';
                fileLabelText.textContent = file.name;
                showToast('Logo chargé', 'success');
            };
            reader.readAsDataURL(file);
        }

        function removeLogo() {
            logoFile = null;
            logoUpload.value = '';
            logoPreview.style.display = 'none';
            fileLabelText.textContent = 'Cliquez ou glissez une image';
            showToast('Logo retiré', 'success');
        }

        // --- ÉVÉNEMENTS ---
        steps.forEach((btn) => {
            btn.addEventListener('click', function() {
                const step = parseInt(this.dataset.step);
                if (step === 3 && !currentQRUrl) generateQR(true);
                goToStep(step);
            });
        });

        toStep1.addEventListener('click', () => goToStep(1));
        toStep2.addEventListener('click', () => goToStep(2));

        generateAndGoStep3.addEventListener('click', function() {
            if (!qrData.value.trim()) {
                showAlert('Entrez des données.', 'error');
                return;
            }
            generateQR(false);
            goToStep(3);
        });

        regenerateBtn.addEventListener('click', () => generateQR(false));
        downloadBtn.addEventListener('click', downloadQR);
        copyBtn.addEventListener('click', copyQR);

        qrData.addEventListener('input', function() {
            updateCharCounter(this.value);
        });

        logoUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) handleLogoFile(this.files[0]);
        });

        fileDropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#1d3a5c';
            this.style.background = '#e7f0fe';
        });
        fileDropArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#cbd8ea';
            this.style.background = '#f8faff';
        });
        fileDropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#cbd8ea';
            this.style.background = '#f8faff';
            if (e.dataTransfer.files.length > 0) {
                logoUpload.files = e.dataTransfer.files;
                handleLogoFile(e.dataTransfer.files[0]);
            }
        });
        removeLogoBtn.addEventListener('click', removeLogo);

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                if (currentStep === 1 || currentStep === 2) {
                    if (!qrData.value.trim()) { showAlert('Entrez des données.', 'error'); return; }
                    generateQR(false);
                    goToStep(3);
                }
            }
        });

        // --- INIT ---
        updateCharCounter(qrData.value);
        updateAssistant(1);
        setTimeout(() => generateQR(true), 300);
        goToStep(1);

        // Petite animation supplémentaire sur les étapes
        document.querySelectorAll('.step-item').forEach((el, i) => {
            el.style.transitionDelay = `${i * 0.05}s`;
        });

    })();
</script>
</body>
</html>
